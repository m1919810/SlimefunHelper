plugins {
	id 'fabric-loom' version "1.15-SNAPSHOT"
	id 'maven-publish'
	id 'com.gradleup.shadow' version "9.0.0-beta13"
}
loom {
	accessWidenerPath = file("src/main/resources/overrideList.accesswidener")
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	gradlePluginPortal()
	mavenLocal()
	mavenCentral()

	maven {
		url 'https://maven.aliyun.com/nexus/content/groups/public'
	}
	maven {
		url 'https://repository.hanbings.io/proxy'
	}
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
	}

}
//apply plugin: 'com.gradleup.shadow'
//apply plugin: 'java'


fabricApi {
	configureDataGeneration()
}
configurations {
	//buildtoolsImplementation.extendsFrom(compileClasspath)
	// Dependencies only used for the guide export, but not shipped

	runtimeClasspath.extendsFrom implementation
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft ("com.mojang:minecraft:${project.minecraft_version}"){
		transitive = false
	}
	//mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	mappings loom.layered {
		mappings file("mapping/yarn-1.21.8+build-special-v2.local-v2.jar")
	}

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modCompileOnly files("libs/jsmacros-1.21-1.9.3.jar")
	modCompileOnly files("libs/jsmacros-1.21-js-extension.jar")
	modCompileOnly files("libs/graal-sdk-23.0.1.jar")

	api 'com.github.houbb:pinyin:0.4.0'
	api 'io.netty:netty-handler-proxy:4.1.97.Final'
	api 'org.yaml:snakeyaml:1.30'
	compileOnly 'org.projectlombok:lombok:1.18.30'   // 最新的 Lombok 版本
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'  // 注解处理器


}

shadowJar {
	minimize()
	archiveFileName = "${project.properties["archives_base_name"]}-${project.version}-shadow-raw.jar"
	configurations = [project.configurations.runtimeClasspath]
	dependencies {
		include dependency('com.github.houbb:.*')
		include dependency('io.netty:netty-handler.*:.*')
		include dependency('io.netty:netty-codec.*:.*')
		include dependency('org.yaml:snakeyaml:.*')
		exclude "mappings/mappings.tiny"
	}
	finalizedBy(tasks.remapJar)
}

//loom {
//	// 禁用自动下载
//	skipDownloadAssets = true
//	skipDownloadMcLibraries = true
//
////	// 或者设置自定义缓存路径
////	customMinecraftCache = file("${project.gradle.gradleUserHomeDir}/caches/fabric-loom")
//}

remapJar {
	dependsOn shadowJar
	inputFile = shadowJar.archiveFile.get().asFile
	archiveFileName = "${project.properties["archives_base_name"]}-${project.version}.jar"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	options.annotationProcessorPath = configurations.annotationProcessor
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
