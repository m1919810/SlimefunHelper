plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version "8.1.1"
}
loom {
	accessWidenerPath = file("src/main/resources/overrideList.accesswidener")
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	gradlePluginPortal()
	mavenLocal()
	mavenCentral()

	maven {
		url 'https://maven.aliyun.com/nexus/content/groups/public'
	}
	maven {
		url 'https://repository.hanbings.io/proxy'
	}
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://repo.destroystokyo.com/repository/maven-public'
	}
	maven {
		url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
	}

}
//apply plugin: 'com.gradleup.shadow'
//apply plugin: 'java'


fabricApi {
	configureDataGeneration()
}
configurations {
	//buildtoolsImplementation.extendsFrom(compileClasspath)
	// Dependencies only used for the guide export, but not shipped

	runtimeClasspath.extendsFrom implementation
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft ("com.mojang:minecraft:${project.minecraft_version}"){
		transitive = false
	}
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	//api 'org.bukkit:bukkit:1.20.1-R0.1-SNAPSHOT'
	api 'com.github.houbb:pinyin:0.4.0'
	api 'io.netty:netty-handler-proxy:4.1.97.Final'
	api 'org.yaml:snakeyaml:1.30'
	compileOnly 'org.projectlombok:lombok:1.18.24'   // 最新的 Lombok 版本
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	annotationProcessor 'org.projectlombok:lombok:1.18.24'  // 注解处理器
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
	// import REI
//	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
//	modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
//	modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"

}

shadowJar {
	minimize()
	archiveFileName = "${project.properties["archives_base_name"]}-${project.version}-shadow-raw.jar"
	configurations = [project.configurations.runtimeClasspath]
	dependencies {
		include dependency('com.github.houbb:.*')
		include dependency('io.netty:netty-handler.*:.*')
		include dependency('io.netty:netty-codec.*:.*')
		include dependency('org.yaml:snakeyaml:.*')
		exclude "mappings/mappings.tiny"
	}
	finalizedBy(tasks.remapJar)
}

remapJar {
	dependsOn shadowJar
	inputFile = shadowJar.archiveFile.get().asFile
	archiveFileName = "${project.properties["archives_base_name"]}-${project.version}.jar"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	options.annotationProcessorPath = configurations.annotationProcessor
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
